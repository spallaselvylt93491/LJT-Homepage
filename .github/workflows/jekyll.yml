name: Build and publish personal homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Inspect rendered pages
        run: |
          echo "Generated HTML pages:"
          find _site -name '*.html' | sort
          echo "--- Home page text ---"
          sed -e 's/<[^>]*>/ /g' _site/index.html
          echo "--- Publications page text ---"
          sed -e 's/<[^>]*>/ /g' _site/publications/index.html
      - name: Enable GitHub Pages
        continue-on-error: true
        run: |
          curl -sS -o /tmp/pages-enable.json -w '%{http_code}\n' -X POST \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"build_type":"workflow"}'
          cat /tmp/pages-enable.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check GitHub Pages settings
        continue-on-error: true
        run: |
          curl -sS -o /tmp/pages-site.json -w '%{http_code}\n' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json"
          cat /tmp/pages-site.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
