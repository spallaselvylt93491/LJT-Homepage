name: Build and publish personal homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Publish built site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/pages-publish
          mkdir -p /tmp/pages-publish
          cd /tmp/pages-publish
          git init -q
          git checkout -q --orphan gh-pages
          cp -r "$GITHUB_WORKSPACE/_site/." .
          touch .nojekyll
          git add -A
          git commit -q -m 'Publish personal homepage'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin gh-pages
          echo "Checking GitHub Pages settings:"
          sleep 5
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json')
          echo "Pages API HTTP ${code}"
          cat /tmp/pages.json
          if [ "$code" != "200" ]; then
            echo "Pages is not enabled by the branch push; removing the temporary branch."
            git push -q origin --delete gh-pages
          fi
