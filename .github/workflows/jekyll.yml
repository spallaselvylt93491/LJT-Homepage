name: Build and publish personal homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Inspect rendered pages
        run: |
          echo "Generated HTML pages:"
          find _site -name '*.html' | sort
          echo "--- Home page text ---"
          sed -e 's/<[^>]*>/ /g' _site/index.html
          echo "--- Publications page text ---"
          sed -e 's/<[^>]*>/ /g' _site/publications/index.html
      - name: Set up Pages publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          authHeader="Authorization: Bearer ${GITHUB_TOKEN}"
          if curl -sfS "$api" -H "$authHeader" -H 'Accept: application/vnd.github+json' > /tmp/pages.json; then
            echo "Pages is already enabled:"
            cat /tmp/pages.json
            exit 0
          fi
          echo "Attempting to enable Pages through the API:"
          curl -sS -o /tmp/enable.json -w 'HTTP %{http_code}\n' -X POST "$api" \
            -H "$authHeader" -H 'Accept: application/vnd.github+json' \
            -d '{"build_type":"workflow"}'
          cat /tmp/enable.json
          if grep -q '"html_url"' /tmp/enable.json; then
            exit 0
          fi
          echo "Publishing the built site to the gh-pages branch:"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/pages-publish
          mkdir -p /tmp/pages-publish
          cd /tmp/pages-publish
          git init -q
          git checkout -q --orphan gh-pages
          cp -r "$GITHUB_WORKSPACE/_site/." .
          touch .nojekyll
          git add -A
          git commit -q -m 'Publish personal homepage'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="$authHeader" push -q --force origin gh-pages
          echo "Checking whether Pages was enabled by the gh-pages push:"
          sleep 5
          if curl -sfS "$api" -H "$authHeader" -H 'Accept: application/vnd.github+json' > /tmp/pages.json; then
            cat /tmp/pages.json
          else
            echo "Pages could not be enabled automatically; removing the temporary branch."
            git -c http.extraheader="$authHeader" push -q origin --delete gh-pages
          fi
